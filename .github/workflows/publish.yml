name: Publish

# Checks every PR and push. A v<version> tag on a main commit also publishes
# @benchrouter/cli with npm trusted publishing (GitHub Actions OIDC): no npm token
# is stored. See RELEASING.md.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Check package
    # This repository is public, so its jobs run on GitHub-hosted runners and
    # never on the organization's own runners, network or credentials. Fork PRs
    # are still skipped here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - run: npm install --global npm@12.0.2
      - run: npm --version
      - run: npm ci
      - run: npm run check

  publish:
    name: Publish package
    needs: package
    # A tag push, or a manual run started from a tag to publish it again.
    if: startsWith(github.ref, 'refs/tags/v')
    # npm trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the main-branch check below can see origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@12.0.2
      - run: npm --version
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - name: Check the tagged commit is on main
        run: |
          # Full ref name, so a tag named origin/main cannot stand in for the branch.
          main_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if ! git merge-base --is-ancestor HEAD "$main_sha"; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main." >&2
            exit 1
          fi
      # No `npm ci`: publishing packs the checked-out files and needs no
      # dependencies, so no install script runs while the job holds the OIDC token.
      # The repository is public, so npm records a provenance statement.
      - run: npm publish --provenance
