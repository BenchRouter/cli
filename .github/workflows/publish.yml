name: Publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bootstrap_stage_0_2_0:
        description: Stage @benchrouter/cli@0.2.0 for one-time package bootstrap
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --version
      - run: npm run check
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
      - name: Configure npm bootstrap authentication
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_stage_0_2_0 == true
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Install npm 12 for staged publishing
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_stage_0_2_0 == true
        run: npm install --global npm@12.0.2
      - name: Stage @benchrouter/cli@0.2.0
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_stage_0_2_0 == true
        run: npm stage publish . --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
