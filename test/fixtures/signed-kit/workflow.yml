name: BenchRouter Evals
run-name: ${{ github.event_name == 'workflow_dispatch' && format('BenchRouter worker {0}', inputs.claim) || '' }}
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .benchrouter/**
      - .github/workflows/benchrouter-evals.yml
      - src/**
  push:
    branches:
      - main
    paths:
      - .benchrouter/**
      - .github/workflows/benchrouter-evals.yml
      - src/**
  workflow_dispatch:
    inputs:
      claim:
        description: BenchRouter startup claim
        required: true
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  eval:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Prepare BenchRouter
        id: benchrouter_prepare
        uses: BenchRouter/eval-action/prepare@v1
      # ---- customer-setup (customer-owned). Add tools needed by your evaluator. ----
      # Every customer setup step must use: if: github.event_name == 'workflow_dispatch'
      # Replay-only repos need no customer setup.
      # ---- end customer-setup ----
      - name: Run BenchRouter
        id: benchrouter_runtime
        uses: BenchRouter/eval-action@v1
        with:
          node: ${{ steps.benchrouter_prepare.outputs.node }}
        env:
          BENCHROUTER_JOB_CEILING_MIN: "120"
          BENCHROUTER_FETCH_TOKEN: ${{ github.token }}
          BENCHROUTER_KIT_VERSION: 0.1.0
